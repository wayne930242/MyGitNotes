name: Deploy Vercel (sparse checkout)
on:
  push:
    # Deploys from core; MYGITNOTES_DEPLOY_BRANCH overrides the branch.
    branches: [core]
    paths:
      - '.github/vercel-sparse-paths.txt'
      - '.vercelignore'
      - 'api/**'
      - 'apps/**'
      - 'docs/agent/**'
      - 'package.json'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-vercel-sparse
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check deployment settings
        id: settings
        env:
          DEPLOY_MODE: ${{ vars.MYGITNOTES_VERCEL_DEPLOY }}
          DEPLOY_BRANCH: ${{ vars.MYGITNOTES_DEPLOY_BRANCH || 'core' }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEPLOY_BRANCH" ]; then
            echo "::notice title=Vercel deploy skipped::This repository deploys from '$DEPLOY_BRANCH' (MYGITNOTES_DEPLOY_BRANCH), not '$GITHUB_REF_NAME'."
          elif [ "$DEPLOY_MODE" = git-integration ]; then
            echo "::notice title=Vercel deploy skipped::MYGITNOTES_VERCEL_DEPLOY=git-integration; Vercel Git integration deploys this repository."
          elif [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice title=Vercel deploy skipped::Set the VERCEL_TOKEN secret and the VERCEL_ORG_ID and VERCEL_PROJECT_ID variables to deploy with sparse checkout."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.settings.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/vercel-sparse-paths.txt
          sparse-checkout-cone-mode: false
      - name: Check out product paths only
        if: steps.settings.outputs.enabled == 'true'
        run: |
          grep -v -e '^#' -e '^$' .github/vercel-sparse-paths.txt > "$RUNNER_TEMP/paths"
          git sparse-checkout set --cone --stdin < "$RUNNER_TEMP/paths"
      - if: steps.settings.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install tooling
        if: steps.settings.outputs.enabled == 'true'
        run: npm install --global pnpm@9.15.9 vercel@59
      - name: Build
        if: steps.settings.outputs.enabled == 'true'
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        if: steps.settings.outputs.enabled == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
