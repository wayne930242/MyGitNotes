# Asks every outside contributor to sign CLA.md once (see CONTRIBUTING.md). Signatures are kept as
# signatures/cla.json on the cla-signatures branch of this repository.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Workspaces that merge Core carry this file too; only the product repository collects signatures.
    if: github.repository == 'wayne930242/MyGitNotes' && (github.event_name == 'pull_request_target' || github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # contributor-assistant/github-action v2.6.1, pinned by commit because it runs with write access.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/wayne930242/MyGitNotes/blob/core/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: wayne930242,dependabot[bot],renovate[bot]
