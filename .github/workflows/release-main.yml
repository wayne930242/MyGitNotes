name: Merge and deploy main
on:
  push:
    branches: [core]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.CORE_SYNC_SSH_KEY }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --global pnpm@9.15.9
          pnpm install --frozen-lockfile
      - name: Verify Core
        run: |
          pnpm check:core-ownership --core
          pnpm check:vercel-sparse-paths --core
          pnpm build
          pnpm test
      - name: Merge Core and synchronize examples
        id: sync
        env:
          CORE_REVISION: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_OWNER_ID: ${{ github.event.repository.owner.id }}
        run: |
          git config user.name "$REPOSITORY_OWNER"
          git config user.email "$REPOSITORY_OWNER_ID+$REPOSITORY_OWNER@users.noreply.github.com"
          node scripts/sync-demo-main.mjs
      - name: Verify Vercel deployment of main
        if: steps.sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.sync.outputs.main_sha }}
        run: node scripts/wait-vercel-status.mjs
