services:
  mygitnotes:
    build: .
    image: mygitnotes:local
    init: true
    restart: unless-stopped
    env_file:
      - ${MYGITNOTES_ENV_FILE:-.env.docker}
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${MYGITNOTES_PORT:-4321}:4321"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - sessions

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    networks:
      - sessions
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:

networks:
  sessions:
    internal: true
