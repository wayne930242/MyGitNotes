version: 2
rows:
  - id: explore
    name: 學習：一次一張卡片
    notebookId: learning
    kind: dynamic
    view: small
    source: &a2
      kind: tag
      tag: study-demo
      notebookId: learning
    progression: &a1
      stages:
        - status: inbox
          intervalDays: 1
        - status: working
          intervalDays: 3
        - status: review
          intervalDays: 7
        - status: done
          intervalDays: 30
      easy: two
    study:
      filter: all
      dueFirst: true
      status: working
  - id: reading
    name: 隨選閱讀
    notebookId: learning
    kind: dynamic
    view: medium
    source:
      kind: tag
      tag: reading
      notebookId: learning
    progression: *a1
  - id: review-stage
    name: 進階複習 · 7 天
    notebookId: learning
    kind: dynamic
    view: small
    source: *a2
    study:
      filter: all
      dueFirst: true
      status: review
  - id: done-stage
    name: 熟悉 · 30 天
    notebookId: learning
    kind: dynamic
    view: thumbnail
    source: *a2
    study:
      filter: all
      dueFirst: true
      status: done
  - id: later
    name: 延後再看
    notebookId: learning
    kind: dynamic
    view: small
    source: *a2
    study:
      filter: future
      dueFirst: true
