version: 1
rows:
  - id: example-graph
    name: Graph Playground
    kind: dynamic
    view: graph
    source:
      kind: tag
      tag: graph-demo
      notebookId: example
    graph:
      nodes:
        - path: notes/example/graph-playground.md
          x: -220
          y: -160
          width: 380
          height: 320
          expanded: true
        - path: notes/example/river-reading.md
          x: 220
          y: -160
          width: 380
          height: 320
          expanded: true
        - path: notes/example/evening-ideas.md
          x: 260
          y: 260
        - path: notes/example/music-resources.md
          x: -50
          y: 330
        - path: notes/example/todo-demo.md
          x: -330
          y: 260
  - id: example-media
    name: Images and Music
    kind: custom
    view: medium
    items:
      - id: example-media-note
        kind: note
        notebookId: example
        path: notes/example/music-resources.md
      - id: example-river-image
        kind: asset
        notebookId: example
        path: notes/example/assets/river-reading.png
      - id: example-desk-image
        kind: asset
        notebookId: example
        path: notes/example/assets/evening-desk.png
      - id: example-song
        kind: youtube
        videoId: dQw4w9WgXcQ
        title: Rick Astley — Never Gonna Give You Up
      - id: example-folder
        kind: folder
        notebookId: example
        path: notes/example/projects
  - id: example-planning
    name: Tasks and Weekly Review
    kind: custom
    view: small
    items:
      - id: example-todo-note
        kind: note
        notebookId: example
        path: notes/example/todo-demo.md
      - id: example-review-note
        kind: note
        notebookId: example
        path: notes/example/projects/weekly-review.md
  - id: example-projects
    name: Projects (Dynamic Folder)
    kind: dynamic
    view: thumbnail
    source:
      kind: folder
      notebookId: example
      path: notes/example/projects
      recursive: true
  - id: explore
    name: 學習：一次一張卡片
    kind: dynamic
    view: small
    source: &a2
      kind: tag
      tag: study-demo
      notebookId: learning
    progression: &a1
      stages:
        - status: inbox
          intervalDays: 1
        - status: working
          intervalDays: 3
        - status: review
          intervalDays: 7
        - status: done
          intervalDays: 30
      easy: two
    study:
      filter: all
      dueFirst: true
      status: working
  - id: reading
    name: 隨選閱讀
    kind: dynamic
    view: medium
    source:
      kind: tag
      tag: reading
      notebookId: learning
    progression: *a1
  - id: review-stage
    name: 進階複習 · 7 天
    kind: dynamic
    view: small
    source: *a2
    study:
      filter: all
      dueFirst: true
      status: review
  - id: done-stage
    name: 熟悉 · 30 天
    kind: dynamic
    view: thumbnail
    source: *a2
    study:
      filter: all
      dueFirst: true
      status: done
  - id: later
    name: 延後再看
    kind: dynamic
    view: small
    source: *a2
    study:
      filter: future
      dueFirst: true
